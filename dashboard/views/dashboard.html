<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChathuX Analytics & Global Telemetry</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Stylesheets: Supports both Express (port 3000) and Live Server (port 5500) -->
    <link rel="stylesheet" href="/dashboard/public/css/style.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="../public/css/style.css">
    <link rel="icon" type="image/png" href="/assets/Logo.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- Ambient Floating Orbs -->
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-3" href="/">
                <img src="/assets/Logo.png" alt="Logo" width="40" height="40" class="brand-logo-img" style="width: 40px; height: 40px; object-fit: contain;" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
                <span class="brand-gradient">ChathuX</span>
            </a>
            <div class="collapse navbar-collapse" id="navContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4 gap-lg-3">
                    <li class="nav-item"><a class="nav-link active text-white" href="/dashboard">Analytics</a></li>
                    <li class="nav-item"><a class="nav-link text-white-50" href="/servers">My Servers</a></li>
                </ul>
                <div id="nav-auth-container"></div>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div>
                <h1 class="fw-bold mb-1">Global System Telemetry</h1>
                <p class="text-muted mb-0">Real-time performance metrics and cross-cluster resource utilization.</p>
            </div>
            <div class="d-flex align-items-center gap-2">
                <span class="pulse-indicator"></span>
                <span class="text-success fw-semibold">Live Operational</span>
            </div>
        </div>

        <!-- Metrics Row -->
        <div class="row g-4 mb-4">
            <div class="col-lg-2 col-md-4 col-6">
                <div class="glass-card text-center">
                    <div class="stat-label">Guilds</div>
                    <div class="stat-number" id="stat-servers">5</div>
                </div>
            </div>
            <div class="col-lg-2 col-md-4 col-6">
                <div class="glass-card text-center">
                    <div class="stat-label">Members</div>
                    <div class="stat-number" id="stat-members">2,450</div>
                </div>
            </div>
            <div class="col-lg-2 col-md-4 col-6">
                <div class="glass-card text-center">
                    <div class="stat-label">Commands</div>
                    <div class="stat-number" id="stat-commands">62</div>
                </div>
            </div>
            <div class="col-lg-2 col-md-4 col-6">
                <div class="glass-card text-center">
                    <div class="stat-label">Memory</div>
                    <div class="stat-number" id="stat-memory">26.8 MB</div>
                </div>
            </div>
            <div class="col-lg-2 col-md-4 col-6">
                <div class="glass-card text-center">
                    <div class="stat-label">Latency</div>
                    <div class="stat-number" id="stat-ping">24ms</div>
                </div>
            </div>
            <div class="col-lg-2 col-md-4 col-6">
                <div class="glass-card text-center">
                    <div class="stat-label">Uptime</div>
                    <div class="stat-number" id="stat-uptime">14h 32m</div>
                </div>
            </div>
        </div>

        <!-- Charts Row -->
        <div class="row g-4">
            <div class="col-lg-8">
                <div class="glass-panel p-4">
                    <h5 class="fw-bold mb-3">Traffic & Command Execution Activity (24h)</h5>
                    <div style="height: 320px; position: relative;">
                        <canvas id="chart-activity"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="glass-panel p-4">
                    <h5 class="fw-bold mb-3">Module Resource Share</h5>
                    <div style="height: 320px; position: relative;">
                        <canvas id="chart-modules"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/dashboard/public/js/particles.js"></script>
    <script src="/dashboard/public/js/main.js"></script>
    <script src="/dashboard/public/js/dashboard.js"></script>
</body>
</html>
